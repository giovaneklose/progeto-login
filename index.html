<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medias.css">
</head>
<body>
    <main>
        <section>
            <div id="img">
                
            </div>
            <div id="form">

                <h1>Login</h1>

                <p>Faça seu login e desfrute de nosso site.</p>

                <form action="iem" method="post">

                    <div class="login">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="em" id="iem" required placeholder="Seu email" minlength="30" maxlength="40">
                        <label for="iem">Gmail -</label>
                    </div>

                    <div class="login">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="pas" id="ipas" required placeholder="Sua senha" min="8" max="12">
                        <label for="ipas">Senha -</label>
                    </div>

                    <input type="submit" value="Enviar">
                    <a href="esqueci.html">
                        Esqueci a senha
                        <span class="material-symbols-outlined">mail</span>
                    </a>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
