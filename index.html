<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medias.css">
</head>
<body>
    <main>
        <section>
            <div id="img">
                
            </div>
            <div id="form">

                <h1>Login</h1>

                <p>Faça seu login e desfrute de nosso site.</p>

                <form action="iem" method="post">

                    <label for="iem">Gmail -</label>
                    <input type="email" name="em" id="iem">

                    <label for="ipas">Senha -</label>
                    <input type="password" name="pas" id="ipas">

                    <input type="reset" value="Limpar">
                    <input type="submit" value="Enviar">

                </form>
            </div>
        </section>
    </main>
</body>
</html>
